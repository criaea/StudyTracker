<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyFlow - Tracker Studio</title>
    
    <!-- 1. Stile (Tailwind CSS) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. Motore React (Caricato PRIMA di tutto il resto) -->
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    
    <!-- 3. Dipendenza Mancante per i Grafici (Fondamentale per Recharts) -->
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    
    <!-- 4. Librerie Grafici e Icone -->
    <script src="https://unpkg.com/recharts@2.10.3/umd/Recharts.js"></script>
    <script src="https://unpkg.com/lucide-react@0.263.1/dist/umd/lucide-react.min.js"></script>
    
    <!-- 5. Babel per tradurre il codice nel browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        // Configurazione colori scuri
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#151e32', 950: '#020617' }
                    }
                }
            }
        }
    </script>
    
    <style>
        body { background-color: #020617; color: white; }
        /* Scrollbar scura */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // --- INIZIO CODICE APP ---
        
        const { useState, useEffect, useMemo } = React;
        
        // Estrazione sicura librerie esterne
        // Recharts
        const RechartsObj = window.Recharts || window.Recharts.default || {};
        const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer } = RechartsObj;

        // Lucide React Icons
        const LucideObj = window.lucideReact || {};
        const getIcon = (name) => LucideObj[name] || (() => <span />); // Fallback invisibile
        
        const Plus = getIcon('Plus');
        const Calendar = getIcon('Calendar');
        const Trash2 = getIcon('Trash2');
        const TrendingUp = getIcon('TrendingUp');
        const Clock = getIcon('Clock');
        const BookOpen = getIcon('BookOpen');
        const CheckCircle = getIcon('CheckCircle');
        const Calculator = getIcon('Calculator');
        const Target = getIcon('Target');
        const Hourglass = getIcon('Hourglass');

        const formatDate = (dateString) => {
            if (!dateString) return '';
            const options = { month: 'short', day: 'numeric' };
            return new Date(dateString).toLocaleDateString('it-IT', options);
        };

        const generateId = () => Math.random().toString(36).substr(2, 9);

        const App = () => {
            const [view, setView] = useState('tracker');
            
            // Caricamento dati con gestione errori
            const [entries, setEntries] = useState(() => {
                try {
                    const saved = localStorage.getItem('studyTrackerData');
                    return saved ? JSON.parse(saved) : [
                        { id: '1', date: '2023-10-20', chapters: 5, exercises: 10, hours: 2 },
                        { id: '2', date: '2023-10-21', chapters: 8, exercises: 2, hours: 3 },
                    ];
                } catch (e) {
                    return [];
                }
            });

            const [totalGoal, setTotalGoal] = useState(() => {
                try {
                    const saved = localStorage.getItem('studyTrackerGoal');
                    return saved ? Number(saved) : 100;
                } catch (e) { return 100; }
            });
            
            const [showOffDays, setShowOffDays] = useState(true);
            const [isAddModalOpen, setIsAddModalOpen] = useState(false);
            const [newEntryDate, setNewEntryDate] = useState('');

            useEffect(() => localStorage.setItem('studyTrackerData', JSON.stringify(entries)), [entries]);
            useEffect(() => localStorage.setItem('studyTrackerGoal', totalGoal.toString()), [totalGoal]);

            const addEntry = (dateStr) => {
                if (entries.find(e => e.date === dateStr)) {
                    alert("Esiste già una voce per questa data.");
                    return;
                }
                setEntries(prev => [...prev, { id: generateId(), date: dateStr, chapters: 0, exercises: 0, hours: 0 }]
                    .sort((a, b) => new Date(b.date) - new Date(a.date)));
                setIsAddModalOpen(false);
                setNewEntryDate('');
            };

            const updateEntry = (id, field, value) => {
                setEntries(prev => prev.map(entry => 
                    entry.id === id ? { ...entry, [field]: Number(value) } : entry
                ));
            };

            const deleteEntry = (id) => {
                if (confirm("Eliminare questa riga?")) {
                    setEntries(prev => prev.filter(e => e.id !== id));
                }
            };

            // Calcoli Analisi
            const chartData = useMemo(() => {
                let sortedData = [...entries].sort((a, b) => new Date(a.date) - new Date(b.date));
                if (sortedData.length === 0) return [];

                if (!showOffDays) return sortedData.map(item => ({ ...item, total: item.chapters + item.exercises, displayDate: formatDate(item.date) }));

                const filledData = [];
                let currentDate = new Date(sortedData[0].date);
                const lastDate = new Date(sortedData[sortedData.length - 1].date);

                let safety = 0;
                while (currentDate <= lastDate && safety < 3650) { // Max 10 anni per sicurezza
                    const dateStr = currentDate.toISOString().split('T')[0];
                    const existing = sortedData.find(e => e.date === dateStr);
                    filledData.push(existing 
                        ? { ...existing, total: existing.chapters + existing.exercises, displayDate: formatDate(existing.date) }
                        : { id: `temp-${dateStr}`, date: dateStr, chapters: 0, exercises: 0, hours: 0, total: 0, displayDate: formatDate(dateStr) }
                    );
                    currentDate.setDate(currentDate.getDate() + 1);
                    safety++;
                }
                return filledData;
            }, [entries, showOffDays]);

            const stats = useMemo(() => {
                const totalHours = entries.reduce((acc, curr) => acc + curr.hours, 0);
                const totalPages = entries.reduce((acc, curr) => acc + curr.chapters, 0);
                const totalExercises = entries.reduce((acc, curr) => acc + curr.exercises, 0);
                const speed = totalHours > 0 ? totalPages / totalHours : 0;
                
                return {
                    pagesPerHour: speed.toFixed(2),
                    exercisesPerHour: totalHours ? (totalExercises / totalHours).toFixed(1) : 0,
                    totalHours,
                    productivityScore: totalHours ? ((totalPages + totalExercises) / totalHours).toFixed(1) : 0,
                    rawPagesPerHour: speed
                };
            }, [entries]);

            const prediction = useMemo(() => {
                const remaining = Math.max(0, totalGoal - stats.totalPages);
                const hours = stats.rawPagesPerHour > 0 ? (remaining / stats.rawPagesPerHour).toFixed(1) : "N/A";
                return {
                    remainingChapters: remaining,
                    hoursNeeded: hours,
                    progress: totalGoal > 0 ? Math.min(100, (stats.totalPages / totalGoal) * 100).toFixed(1) : 0
                };
            }, [totalGoal, stats]);

            // Componenti UI
            const StatCard = ({ title, value, sub, icon: Icon, color }) => (
                <div className="bg-slate-800 p-4 rounded-xl border border-slate-700">
                    <div className="flex justify-between items-start mb-2">
                        <div><p className="text-slate-400 text-xs uppercase">{title}</p><h3 className="text-2xl font-bold mt-1">{value}</h3></div>
                        <div className={`p-2 rounded-lg bg-opacity-20 ${color.replace('text-', 'bg-')}`}><Icon className={`w-5 h-5 ${color}`} /></div>
                    </div>
                    <p className="text-slate-500 text-sm">{sub}</p>
                </div>
            );

            const Chart = ({ data, dataKey, color, title }) => {
                if (!LineChart) return <div className="bg-slate-800 p-4 h-80 rounded-xl flex items-center justify-center text-slate-500">Caricamento Grafico...</div>;
                
                return (
                    <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 h-80 flex flex-col">
                        <h3 className="text-slate-300 font-medium mb-4 flex items-center gap-2"><span className="w-2 h-2 rounded-full" style={{backgroundColor: color}}></span>{title}</h3>
                        <div className="flex-1 w-full min-h-0">
                            <ResponsiveContainer width="100%" height="100%">
                                <LineChart data={data}>
                                    <CartesianGrid strokeDasharray="3 3" stroke="#334155" vertical={false} />
                                    <XAxis dataKey="displayDate" stroke="#64748b" tick={{fontSize: 12}} tickMargin={10} />
                                    <YAxis stroke="#64748b" tick={{fontSize: 12}} />
                                    <Tooltip contentStyle={{ backgroundColor: '#1e293b', borderColor: '#334155', color: '#f1f5f9' }} />
                                    <Line type="monotone" dataKey={dataKey} stroke={color} strokeWidth={3} dot={{ r: 4, fill: '#1e293b' }} />
                                </LineChart>
                            </ResponsiveContainer>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen bg-slate-950 text-slate-200 pb-20">
                    <header className="bg-slate-900 border-b border-slate-800 sticky top-0 z-20 shadow-md">
                        <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="bg-indigo-600 p-2 rounded-lg"><TrendingUp className="w-5 h-5 text-white" /></div>
                                <h1 className="font-bold text-xl text-white hidden sm:block">Study<span className="text-indigo-400">Flow</span></h1>
                            </div>
                            <nav className="flex bg-slate-800 p-1 rounded-lg">
                                {['tracker', 'analytics', 'prediction'].map(v => (
                                    <button key={v} onClick={() => setView(v)} className={`px-4 py-1.5 rounded-md text-sm font-medium capitalize ${view === v ? 'bg-slate-700 text-white' : 'text-slate-400 hover:text-slate-200'}`}>
                                        {v}
                                    </button>
                                ))}
                            </nav>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto px-4 py-8">
                        {view === 'tracker' && (
                            <div className="animate-in fade-in">
                                <div className="flex justify-between items-center mb-6">
                                    <div><h2 className="text-2xl font-bold text-white">Diario Studio</h2><p className="text-slate-400 text-sm">Registra i tuoi progressi.</p></div>
                                    <div className="flex gap-2">
                                        <button onClick={() => setIsAddModalOpen(true)} className="px-4 py-2 bg-slate-800 text-slate-200 rounded-lg border border-slate-700 text-sm">Data Custom</button>
                                        <button onClick={() => addEntry(new Date().toISOString().split('T')[0])} className="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm flex items-center gap-2"><Plus className="w-4 h-4"/> Oggi</button>
                                    </div>
                                </div>
                                <div className="bg-slate-900 rounded-xl border border-slate-800 overflow-hidden shadow-xl overflow-x-auto">
                                    <table className="w-full text-left border-collapse">
                                        <thead>
                                            <tr className="bg-slate-800/50 border-b border-slate-700">
                                                <th className="p-4 text-xs font-semibold text-slate-400 uppercase w-32">Data</th>
                                                <th className="p-4 text-xs font-semibold text-blue-400 uppercase text-center bg-blue-950/20">Capitoli</th>
                                                <th className="p-4 text-xs font-semibold text-purple-400 uppercase text-center bg-purple-950/20">Esercizi</th>
                                                <th className="p-4 text-xs font-semibold text-amber-400 uppercase text-center bg-amber-950/20">Ore</th>
                                                <th className="p-4 text-xs font-semibold text-emerald-400 uppercase text-center bg-emerald-950/20">Totale</th>
                                                <th className="p-4 text-right"></th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-800">
                                            {entries.map(entry => (
                                                <tr key={entry.id} className="hover:bg-slate-800/30">
                                                    <td className="p-4"><div className="font-medium">{formatDate(entry.date)}</div></td>
                                                    <td className="p-4 text-center bg-blue-950/5"><input type="number" min="0" className="w-20 bg-slate-950 border border-slate-700 rounded px-2 py-1 text-center text-blue-200" value={entry.chapters} onChange={(e) => updateEntry(entry.id, 'chapters', e.target.value)} /></td>
                                                    <td className="p-4 text-center bg-purple-950/5"><input type="number" min="0" className="w-20 bg-slate-950 border border-slate-700 rounded px-2 py-1 text-center text-purple-200" value={entry.exercises} onChange={(e) => updateEntry(entry.id, 'exercises', e.target.value)} /></td>
                                                    <td className="p-4 text-center bg-amber-950/5"><input type="number" min="0" step="0.5" className="w-20 bg-slate-950 border border-slate-700 rounded px-2 py-1 text-center text-amber-200" value={entry.hours} onChange={(e) => updateEntry(entry.id, 'hours', e.target.value)} /></td>
                                                    <td className="p-4 text-center bg-emerald-950/5"><span className="inline-flex items-center justify-center w-16 py-1 bg-emerald-900/30 text-emerald-300 rounded font-bold border border-emerald-500/20">{entry.chapters + entry.exercises}</span></td>
                                                    <td className="p-4 text-right"><button onClick={() => deleteEntry(entry.id)} className="p-2 text-slate-500 hover:text-red-400"><Trash2 className="w-4 h-4" /></button></td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {view === 'analytics' && (
                            <div className="animate-in fade-in">
                                <h2 className="text-2xl font-bold text-white mb-4">Analytics</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                                    <StatCard title="Produttività" value={stats.productivityScore} sub="Output / Hr" icon={TrendingUp} color="text-emerald-400" />
                                    <StatCard title="Velocità Lettura" value={stats.pagesPerHour} sub="Pagine / Hr" icon={BookOpen} color="text-blue-400" />
                                    <StatCard title="Velocità Esercizi" value={stats.exercisesPerHour} sub="Esercizi / Hr" icon={CheckCircle} color="text-purple-400" />
                                    <StatCard title="Ore Totali" value={`${stats.totalHours}h`} sub="Tempo totale" icon={Clock} color="text-orange-400" />
                                </div>
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                    <Chart title="Ore Studio" data={chartData} dataKey="hours" color="#fbbf24" />
                                    <Chart title="Capitoli / Pagine" data={chartData} dataKey="chapters" color="#60a5fa" />
                                    <Chart title="Esercizi" data={chartData} dataKey="exercises" color="#c084fc" />
                                    <Chart title="Output Totale" data={chartData} dataKey="total" color="#34d399" />
                                </div>
                            </div>
                        )}

                        {view === 'prediction' && (
                            <div className="animate-in fade-in max-w-2xl mx-auto text-center">
                                <h2 className="text-2xl font-bold text-white mb-8">Previsione Tempi</h2>
                                <div className="bg-slate-800 p-8 rounded-2xl mb-8 border border-slate-700">
                                    <label className="block text-sm font-bold uppercase text-indigo-400 mb-2">Obiettivo Totale (Pagine/Capitoli)</label>
                                    <input type="number" value={totalGoal} onChange={(e) => setTotalGoal(Math.max(0, Number(e.target.value)))} className="w-full bg-slate-900 p-4 rounded-xl text-2xl text-white border border-slate-600 mb-4" />
                                    <div className="flex justify-between text-sm mb-1"><span className="text-slate-400">Progresso</span><span className="text-white font-bold">{prediction.progress}%</span></div>
                                    <div className="h-4 bg-slate-900 rounded-full overflow-hidden"><div className="h-full bg-indigo-600 transition-all duration-1000" style={{ width: `${prediction.progress}%` }}></div></div>
                                </div>
                                <div className="bg-gradient-to-br from-indigo-900 to-slate-900 p-8 rounded-2xl border border-indigo-500/30">
                                    <p className="text-indigo-200 mb-2">Tempo Stimato per finire</p>
                                    <h3 className="text-5xl font-black text-white">{prediction.hoursNeeded} <span className="text-2xl text-slate-400 font-normal">ore</span></h3>
                                    <p className="text-sm text-slate-400 mt-2">Basato sulla tua media di {stats.pagesPerHour} pag/ora.</p>
                                </div>
                            </div>
                        )}
                    </main>

                    {isAddModalOpen && (
                        <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
                            <div className="bg-slate-900 p-6 rounded-xl w-full max-w-sm border border-slate-800">
                                <h3 className="text-xl font-bold text-white mb-4">Aggiungi Data</h3>
                                <input type="date" className="w-full bg-slate-950 p-3 rounded-lg text-white mb-6 border border-slate-700" value={newEntryDate} onChange={(e) => setNewEntryDate(e.target.value)} />
                                <div className="flex gap-3">
                                    <button onClick={() => setIsAddModalOpen(false)} className="flex-1 py-2 bg-slate-800 rounded-lg text-slate-300">Annulla</button>
                                    <button onClick={() => newEntryDate && addEntry(newEntryDate)} className="flex-1 py-2 bg-indigo-600 rounded-lg text-white">Aggiungi</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
