<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyFlow - Cloud Sync</title>
    
    <!-- 1. Stile (Tailwind CSS) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. Motore React (Production) -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    
    <!-- 3. Helper Grafici -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    
    <!-- 4. Libreria Grafici (Recharts) -->
    <script src="https://unpkg.com/recharts@2.10.3/umd/Recharts.js"></script>
    
    <!-- 5. Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 6. Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, doc, setDoc, onSnapshot, collection } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        window.initFirebase = () => {
            try {
                const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'demo-app';
                const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                
                if (!firebaseConfig) {
                    console.warn("Firebase config mancante. Modalità offline.");
                    return null;
                }

                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                const db = getFirestore(app);
                
                return { 
                    auth, db, appId, initialAuthToken,
                    signInAnonymously, signInWithCustomToken, onAuthStateChanged, 
                    doc, setDoc, onSnapshot, collection 
                };
            } catch (e) {
                console.error("Errore inizializzazione Firebase:", e);
                return null;
            }
        };
    </script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#151e32', 950: '#020617' }
                    }
                }
            }
        }
    </script>
    
    <style>
        body { background-color: #020617; color: white; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .loader { border: 3px solid #f3f3f3; border-radius: 50%; border-top: 3px solid #6366f1; width: 24px; height: 24px; -webkit-animation: spin 1s linear infinite; animation: spin 1s linear infinite; }
        @-webkit-keyframes spin { 0% { -webkit-transform: rotate(0deg); } 100% { -webkit-transform: rotate(360deg); } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        
        // --- ICONE INTEGRATE ---
        const Icon = ({ d, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {d}
            </svg>
        );

        const Icons = {
            Plus: (props) => <Icon {...props} d={<><path d="M5 12h14"/><path d="M12 5v14"/></>} />,
            Calendar: (props) => <Icon {...props} d={<><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></>} />,
            Trash2: (props) => <Icon {...props} d={<><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></>} />,
            TrendingUp: (props) => <Icon {...props} d={<><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></>} />,
            Clock: (props) => <Icon {...props} d={<><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>} />,
            BookOpen: (props) => <Icon {...props} d={<><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></>} />,
            CheckCircle: (props) => <Icon {...props} d={<><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>} />,
            Calculator: (props) => <Icon {...props} d={<><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></>} />,
            Target: (props) => <Icon {...props} d={<><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></>} />,
            Hourglass: (props) => <Icon {...props} d={<><path d="M5 22h14"/><path d="M5 2h14"/><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"/><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"/></>} />,
            Flag: (props) => <Icon {...props} d={<><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/></>} />,
            User: (props) => <Icon {...props} d={<><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>} />,
            LogOut: (props) => <Icon {...props} d={<><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></>} />,
            Cloud: (props) => <Icon {...props} d={<><path d="M17.5 19c0-1.7-1.3-3-3-3h-1.1c-.5-2.3-2.5-4-4.9-4-2.8 0-5 2.2-5 5v1h-.5C1.2 19 0 20.2 0 21.5S1.2 24 2.5 24h15c1.4 0 2.5-1.1 2.5-2.5S18.9 19 17.5 19z"/></>} />,
        };

        // --- APP LOGIC ---

        const RechartsObj = window.Recharts || window.Recharts.default || {};
        const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer } = RechartsObj;

        const formatDate = (dateString) => {
            if (!dateString) return '';
            const options = { month: 'short', day: 'numeric' };
            return new Date(dateString).toLocaleDateString('it-IT', options);
        };

        const generateId = () => Math.random().toString(36).substr(2, 9);

        const App = () => {
            // --- FIREBASE STATE ---
            const [firebase, setFirebase] = useState(null);
            const [user, setUser] = useState(null);
            const [username, setUsername] = useState(() => localStorage.getItem('studyTrackerUsername') || '');
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [dbLoading, setDbLoading] = useState(false);
            const [statusMsg, setStatusMsg] = useState("");

            // --- APP STATE ---
            const [view, setView] = useState('tracker');
            const [entries, setEntries] = useState([]);
            const [totalGoal, setTotalGoal] = useState(100);
            const [totalExercisesGoal, setTotalExercisesGoal] = useState(50);
            
            const [showOffDays, setShowOffDays] = useState(true);
            const [isAddModalOpen, setIsAddModalOpen] = useState(false);
            const [newEntryDate, setNewEntryDate] = useState('');
            const [isGoalEntry, setIsGoalEntry] = useState(false);

            // 1. Init Firebase & Auth
            useEffect(() => {
                const fb = window.initFirebase ? window.initFirebase() : null;
                if (!fb) {
                    // Fallback Offline
                    const localData = localStorage.getItem('studyTrackerData');
                    if (localData) setEntries(JSON.parse(localData));
                    setIsLoggedIn(true);
                    return;
                }

                setFirebase(fb);

                const performAuth = async () => {
                    try {
                        if (fb.initialAuthToken) {
                            await fb.signInWithCustomToken(fb.auth, fb.initialAuthToken);
                        } else {
                            await fb.signInAnonymously(fb.auth);
                        }
                    } catch (err) {
                        console.error("Auth Failed", err);
                        setStatusMsg("Auth Error");
                    }
                };

                performAuth();

                const unsubscribe = fb.onAuthStateChanged(fb.auth, (u) => {
                    setUser(u);
                });
                return () => unsubscribe();
            }, []);

            // 2. Sync Logic (Read)
            useEffect(() => {
                if (!firebase || !user || !username) return;

                setDbLoading(true);
                const { db, appId, doc, onSnapshot } = firebase;
                
                // Percorso pubblico per username
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'trackers', username.toLowerCase().trim());

                const unsubscribe = onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        setEntries(data.entries || []);
                        setTotalGoal(Number(data.totalGoal) || 100);
                        setTotalExercisesGoal(Number(data.totalExercisesGoal) || 50);
                    }
                    setDbLoading(false);
                    setIsLoggedIn(true);
                }, (error) => {
                    console.error("Sync Error:", error);
                    setDbLoading(false);
                    // Se fallisce, lasciamo l'utente lavorare ma avvisiamo
                    if (error.code === 'permission-denied') {
                        setStatusMsg("Permessi negati (Riprova)");
                    } else {
                        setStatusMsg("Offline");
                    }
                    setIsLoggedIn(true); // Permetti comunque di usare l'app
                });

                return () => unsubscribe();
            }, [firebase, user, username]);

            // 3. Save Logic (Write with Debounce)
            const saveTimeoutRef = useRef(null);
            
            useEffect(() => {
                if (!isLoggedIn || !firebase || !username) {
                    localStorage.setItem('studyTrackerData', JSON.stringify(entries));
                    return;
                }

                if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);
                setStatusMsg("Salvataggio...");
                
                saveTimeoutRef.current = setTimeout(async () => {
                    try {
                        const { db, appId, doc, setDoc } = firebase;
                        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'trackers', username.toLowerCase().trim());
                        
                        await setDoc(docRef, {
                            entries,
                            totalGoal,
                            totalExercisesGoal,
                            lastUpdated: new Date().toISOString()
                        });
                        setStatusMsg("Salvato nel cloud");
                        setTimeout(() => setStatusMsg(""), 2000);
                    } catch (e) {
                        console.error("Save Error:", e);
                        setStatusMsg("Errore salvataggio");
                    }
                }, 1000);

            }, [entries, totalGoal, totalExercisesGoal, isLoggedIn, firebase, username]);


            // --- ACTIONS ---

            const handleLogin = () => {
                if (username.trim().length < 3) {
                    alert("Il nome utente deve avere almeno 3 caratteri.");
                    return;
                }
                localStorage.setItem('studyTrackerUsername', username);
                if (!firebase) setIsLoggedIn(true);
            };

            const handleLogout = () => {
                setUsername('');
                setIsLoggedIn(false);
                setEntries([]);
                localStorage.removeItem('studyTrackerUsername');
            };

            const openModal = (isGoal) => {
                setIsGoalEntry(isGoal);
                setNewEntryDate(new Date().toISOString().split('T')[0]); // IMPORTO: Default su Oggi!
                setIsAddModalOpen(true);
            };

            const addEntry = (dateStr, isGoal = false) => {
                if (entries.find(e => e.date === dateStr && e.isGoal === isGoal)) {
                    // AVVISO ESPLICITO per entrambi i casi
                    alert(isGoal ? "Esiste già un obiettivo per questa data." : "Esiste già una voce per questa data.");
                    return;
                }
                setEntries(prev => [...prev, { id: generateId(), date: dateStr, chapters: 0, exercises: 0, hours: 0, isGoal: isGoal }]
                    .sort((a, b) => new Date(b.date) - new Date(a.date)));
                setIsAddModalOpen(false);
                setNewEntryDate('');
                setIsGoalEntry(false);
            };

            const updateEntry = (id, field, value) => {
                setEntries(prev => prev.map(entry => 
                    entry.id === id ? { ...entry, [field]: Number(value) } : entry
                ));
            };

            const deleteEntry = (id) => {
                setEntries(prev => prev.filter(e => e.id !== id));
            };

            // --- CALCS ---

            const validEntries = useMemo(() => entries.filter(e => !e.isGoal), [entries]);

            const chartData = useMemo(() => {
                let sortedData = [...validEntries].sort((a, b) => new Date(a.date) - new Date(b.date));
                if (sortedData.length === 0) return [];

                if (!showOffDays) return sortedData.map(item => ({ ...item, total: item.chapters + item.exercises, displayDate: formatDate(item.date) }));

                const filledData = [];
                let currentDate = new Date(sortedData[0].date);
                const lastDate = new Date(sortedData[sortedData.length - 1].date);

                let safety = 0;
                while (currentDate <= lastDate && safety < 3650) {
                    const dateStr = currentDate.toISOString().split('T')[0];
                    const existing = sortedData.find(e => e.date === dateStr);
                    filledData.push(existing 
                        ? { ...existing, total: existing.chapters + existing.exercises, displayDate: formatDate(existing.date) }
                        : { id: `temp-${dateStr}`, date: dateStr, chapters: 0, exercises: 0, hours: 0, total: 0, displayDate: formatDate(dateStr) }
                    );
                    currentDate.setDate(currentDate.getDate() + 1);
                    safety++;
                }
                return filledData;
            }, [validEntries, showOffDays]);

            const stats = useMemo(() => {
                const totalHours = validEntries.reduce((acc, curr) => acc + curr.hours, 0);
                const totalPages = validEntries.reduce((acc, curr) => acc + curr.chapters, 0);
                const totalExercises = validEntries.reduce((acc, curr) => acc + curr.exercises, 0);
                const speed = totalHours > 0 ? totalPages / totalHours : 0;
                const exSpeed = totalHours > 0 ? totalExercises / totalHours : 0;
                
                return {
                    pagesPerHour: speed.toFixed(2),
                    exercisesPerHour: totalHours ? (totalExercises / totalHours).toFixed(1) : 0,
                    totalHours,
                    totalPages,
                    totalExercises,
                    productivityScore: totalHours ? ((totalPages + totalExercises) / totalHours).toFixed(1) : 0,
                    rawPagesPerHour: speed,
                    rawExPerHour: exSpeed
                };
            }, [validEntries]);

            const prediction = useMemo(() => {
                const tGoal = Number(totalGoal) || 0;
                const tExGoal = Number(totalExercisesGoal) || 0;
                const currentPages = Number(stats.totalPages) || 0;
                const currentEx = Number(stats.totalExercises) || 0;
                const speedPages = Number(stats.rawPagesPerHour) || 0;
                const speedEx = Number(stats.rawExPerHour) || 0;

                const remainingPages = Math.max(0, tGoal - currentPages);
                const hoursPages = speedPages > 0 ? (remainingPages / speedPages).toFixed(1) : "N/A";
                const progressPages = tGoal > 0 ? Math.min(100, (currentPages / tGoal) * 100).toFixed(1) : 0;

                const remainingEx = Math.max(0, tExGoal - currentEx);
                const hoursEx = speedEx > 0 ? (remainingEx / speedEx).toFixed(1) : "N/A";
                const progressEx = tExGoal > 0 ? Math.min(100, (currentEx / tExGoal) * 100).toFixed(1) : 0;

                return { remainingPages, hoursPages, progressPages, remainingEx, hoursEx, progressEx };
            }, [totalGoal, totalExercisesGoal, stats]);

            // --- COMPONENTS ---

            const StatCard = ({ title, value, sub, icon: IconComp, color }) => (
                <div className="bg-slate-800 p-4 rounded-xl border border-slate-700">
                    <div className="flex justify-between items-start mb-2">
                        <div><p className="text-slate-400 text-xs uppercase">{title}</p><h3 className="text-2xl font-bold mt-1">{value}</h3></div>
                        <div className={`p-2 rounded-lg bg-opacity-20 ${color.replace('text-', 'bg-')}`}><IconComp className={`w-5 h-5 ${color}`} /></div>
                    </div>
                    <p className="text-slate-500 text-sm">{sub}</p>
                </div>
            );

            const Chart = ({ data, dataKey, color, title }) => {
                if (!LineChart) return <div className="bg-slate-800 p-4 h-80 rounded-xl flex items-center justify-center text-slate-500">Caricamento Grafico...</div>;
                return (
                    <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 h-80 flex flex-col">
                        <h3 className="text-slate-300 font-medium mb-4 flex items-center gap-2"><span className="w-2 h-2 rounded-full" style={{backgroundColor: color}}></span>{title}</h3>
                        <div className="flex-1 w-full min-h-0">
                            <ResponsiveContainer width="100%" height="100%">
                                <LineChart data={data}>
                                    <CartesianGrid strokeDasharray="3 3" stroke="#334155" vertical={false} />
                                    <XAxis dataKey="displayDate" stroke="#64748b" tick={{fontSize: 12}} tickMargin={10} />
                                    <YAxis stroke="#64748b" tick={{fontSize: 12}} />
                                    <Tooltip contentStyle={{ backgroundColor: '#1e293b', borderColor: '#334155', color: '#f1f5f9' }} />
                                    <Line type="monotone" dataKey={dataKey} stroke={color} strokeWidth={3} dot={{ r: 4, fill: '#1e293b' }} />
                                </LineChart>
                            </ResponsiveContainer>
                        </div>
                    </div>
                );
            };

            // --- LOGIN SCREEN ---
            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen bg-slate-950 flex items-center justify-center p-4">
                        <div className="bg-slate-900 p-8 rounded-2xl border border-slate-800 shadow-2xl max-w-md w-full text-center">
                            <div className="bg-indigo-600 w-16 h-16 rounded-xl flex items-center justify-center mx-auto mb-6 shadow-lg shadow-indigo-500/30">
                                <Icons.User className="w-8 h-8 text-white" />
                            </div>
                            <h1 className="text-3xl font-bold text-white mb-2">Benvenuto</h1>
                            <p className="text-slate-400 mb-8">Inserisci un nome utente per sincronizzare i tuoi progressi su tutti i dispositivi.</p>
                            
                            <input 
                                type="text" 
                                placeholder="Es. MarioRossi" 
                                className="w-full bg-slate-950 border border-slate-700 p-4 rounded-xl text-white mb-4 focus:border-indigo-500 outline-none text-center text-lg"
                                value={username}
                                onChange={(e) => setUsername(e.target.value)}
                                onKeyDown={(e) => e.key === 'Enter' && handleLogin()}
                            />
                            
                            <button 
                                onClick={handleLogin}
                                disabled={dbLoading}
                                className="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-4 rounded-xl font-bold text-lg transition-all flex items-center justify-center gap-2 disabled:opacity-50"
                            >
                                {dbLoading ? <div className="loader"></div> : "Entra e Sincronizza"}
                            </button>
                            
                            <p className="text-xs text-slate-600 mt-6">
                                Nota: Usa un nome unico. Chiunque conosca questo nome potrà vedere questi dati.
                            </p>
                        </div>
                    </div>
                );
            }

            // --- MAIN APP ---
            return (
                <div className="min-h-screen bg-slate-950 text-slate-200 pb-20">
                    <header className="bg-slate-900 border-b border-slate-800 sticky top-0 z-20 shadow-md">
                        <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="bg-indigo-600 p-2 rounded-lg"><Icons.TrendingUp className="w-5 h-5 text-white" /></div>
                                <div className="hidden sm:block">
                                    <h1 className="font-bold text-xl text-white leading-none">Study<span className="text-indigo-400">Flow</span></h1>
                                    <div className="flex items-center gap-1 text-xs text-slate-500">
                                        <span className="w-2 h-2 rounded-full bg-green-500"></span>
                                        {username}
                                        {statusMsg && <span className="text-indigo-400 ml-2">• {statusMsg}</span>}
                                    </div>
                                </div>
                            </div>
                            <div className="flex items-center gap-2">
                                <nav className="flex bg-slate-800 p-1 rounded-lg">
                                    {['tracker', 'analytics', 'prediction'].map(v => (
                                        <button key={v} onClick={() => setView(v)} className={`px-3 py-1.5 rounded-md text-sm font-medium capitalize ${view === v ? 'bg-slate-700 text-white' : 'text-slate-400 hover:text-slate-200'}`}>
                                            {v}
                                        </button>
                                    ))}
                                </nav>
                                <button onClick={handleLogout} className="p-2 bg-slate-800 hover:bg-red-900/30 hover:text-red-400 rounded-lg text-slate-400 transition-colors" title="Esci">
                                    <Icons.LogOut className="w-5 h-5" />
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto px-4 py-8">
                        {view === 'tracker' && (
                            <div className="animate-in fade-in">
                                <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                                    <div><h2 className="text-2xl font-bold text-white">Diario</h2><p className="text-slate-400 text-sm">Ciao {username}, ecco i tuoi progressi.</p></div>
                                    <div className="flex flex-wrap gap-2">
                                        <button onClick={() => openModal(true)} className="px-4 py-2 bg-cyan-900/40 hover:bg-cyan-800/50 text-cyan-200 border border-cyan-700/50 rounded-lg text-sm flex items-center gap-2"><Icons.Flag className="w-4 h-4"/> Obiettivo</button>
                                        <button onClick={() => openModal(false)} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-700 text-sm flex items-center gap-2"><Icons.Calendar className="w-4 h-4"/> Custom</button>
                                        <button onClick={() => addEntry(new Date().toISOString().split('T')[0], false)} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-sm flex items-center gap-2"><Icons.Plus className="w-4 h-4"/> Oggi</button>
                                    </div>
                                </div>
                                <div className="bg-slate-900 rounded-xl border border-slate-800 overflow-hidden shadow-xl overflow-x-auto">
                                    <table className="w-full text-left border-collapse">
                                        <thead>
                                            <tr className="bg-slate-800/50 border-b border-slate-700">
                                                <th className="p-4 text-xs font-semibold text-slate-400 uppercase w-32">Data</th>
                                                <th className="p-4 text-xs font-semibold text-blue-400 uppercase text-center bg-blue-950/20">Capitoli</th>
                                                <th className="p-4 text-xs font-semibold text-purple-400 uppercase text-center bg-purple-950/20">Esercizi</th>
                                                <th className="p-4 text-xs font-semibold text-emerald-400 uppercase text-center bg-emerald-950/20">Totale</th>
                                                <th className="p-4 text-xs font-semibold text-amber-400 uppercase text-center bg-amber-950/20">Ore</th>
                                                <th className="p-4 text-right"></th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-800">
                                            {entries.map(entry => (
                                                <tr key={entry.id} className={`transition-colors ${entry.isGoal ? 'bg-cyan-950/20 hover:bg-cyan-950/30' : 'hover:bg-slate-800/30'}`}>
                                                    <td className="p-4">
                                                        <div className={`font-medium ${entry.isGoal ? 'text-cyan-300 flex items-center gap-2' : ''}`}>
                                                            {entry.isGoal && <Icons.Flag className="w-3 h-3" />}
                                                            {formatDate(entry.date)}
                                                        </div>
                                                        {entry.isGoal && <span className="text-[10px] uppercase tracking-wide text-cyan-500/70 font-bold">Obiettivo</span>}
                                                    </td>
                                                    <td className={`p-4 text-center ${entry.isGoal ? '' : 'bg-blue-950/5'}`}><input type="number" min="0" className={`w-20 bg-transparent border rounded px-2 py-1 text-center outline-none focus:ring-1 ${entry.isGoal ? 'border-cyan-700/50 text-cyan-200 focus:ring-cyan-500' : 'bg-slate-950 border-slate-700 text-blue-200 focus:ring-blue-500'}`} value={entry.chapters} onChange={(e) => updateEntry(entry.id, 'chapters', e.target.value)} /></td>
                                                    <td className={`p-4 text-center ${entry.isGoal ? '' : 'bg-purple-950/5'}`}><input type="number" min="0" className={`w-20 bg-transparent border rounded px-2 py-1 text-center outline-none focus:ring-1 ${entry.isGoal ? 'border-cyan-700/50 text-cyan-200 focus:ring-cyan-500' : 'bg-slate-950 border-slate-700 text-purple-200 focus:ring-purple-500'}`} value={entry.exercises} onChange={(e) => updateEntry(entry.id, 'exercises', e.target.value)} /></td>
                                                    <td className={`p-4 text-center ${entry.isGoal ? '' : 'bg-emerald-950/5'}`}><span className={`inline-flex items-center justify-center w-16 py-1 rounded font-bold border ${entry.isGoal ? 'bg-cyan-900/30 text-cyan-300 border-cyan-500/20' : 'bg-emerald-900/30 text-emerald-300 border-emerald-500/20'}`}>{entry.chapters + entry.exercises}</span></td>
                                                    <td className={`p-4 text-center ${entry.isGoal ? '' : 'bg-amber-950/5'}`}><input type="number" min="0" step="0.5" className={`w-20 bg-transparent border rounded px-2 py-1 text-center outline-none focus:ring-1 ${entry.isGoal ? 'border-cyan-700/50 text-cyan-200 focus:ring-cyan-500' : 'bg-slate-950 border-slate-700 text-amber-200 focus:ring-amber-500'}`} value={entry.hours} onChange={(e) => updateEntry(entry.id, 'hours', e.target.value)} /></td>
                                                    <td className="p-4 text-right"><button onClick={() => deleteEntry(entry.id)} className="p-2 text-slate-500 hover:text-red-400"><Icons.Trash2 className="w-4 h-4" /></button></td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {view === 'analytics' && (
                            <div className="animate-in fade-in">
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                                    <StatCard title="Produttività" value={stats.productivityScore} sub="Output / Hr" icon={Icons.TrendingUp} color="text-emerald-400" />
                                    <StatCard title="Velocità Lettura" value={stats.pagesPerHour} sub="Pagine / Hr" icon={Icons.BookOpen} color="text-blue-400" />
                                    <StatCard title="Velocità Esercizi" value={stats.exercisesPerHour} sub="Esercizi / Hr" icon={Icons.CheckCircle} color="text-purple-400" />
                                    <StatCard title="Ore Totali" value={`${stats.totalHours}h`} sub="Tempo totale" icon={Icons.Clock} color="text-orange-400" />
                                </div>
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                    <Chart title="Ore Studio" data={chartData} dataKey="hours" color="#fbbf24" />
                                    <Chart title="Capitoli / Pagine" data={chartData} dataKey="chapters" color="#60a5fa" />
                                    <Chart title="Esercizi" data={chartData} dataKey="exercises" color="#c084fc" />
                                    <Chart title="Output Totale" data={chartData} dataKey="total" color="#34d399" />
                                </div>
                            </div>
                        )}

                        {view === 'prediction' && (
                            <div className="animate-in fade-in max-w-4xl mx-auto">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                    <div className="space-y-4">
                                        <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700">
                                            <label className="block text-sm font-bold uppercase text-blue-400 mb-2 flex items-center gap-2"><Icons.BookOpen className="w-4 h-4"/> Totale Pagine</label>
                                            <input type="number" value={totalGoal} onChange={(e) => setTotalGoal(Math.max(0, Number(e.target.value)))} className="w-full bg-slate-900 p-4 rounded-xl text-2xl text-white border border-slate-600 mb-4" />
                                            <div className="flex justify-between text-sm mb-1"><span className="text-slate-400">Progresso</span><span className="text-white font-bold">{prediction.progressPages}%</span></div>
                                            <div className="h-3 bg-slate-900 rounded-full overflow-hidden"><div className="h-full bg-blue-500 transition-all duration-1000" style={{ width: `${prediction.progressPages}%` }}></div></div>
                                        </div>
                                        <div className="bg-gradient-to-br from-blue-900/50 to-slate-900 p-6 rounded-2xl border border-blue-500/30 text-center">
                                            <p className="text-blue-200 mb-1 text-sm uppercase tracking-wider">Tempo stimato lettura</p>
                                            <h3 className="text-4xl font-black text-white">{prediction.hoursPages} <span className="text-xl text-slate-400 font-normal">ore</span></h3>
                                            <p className="text-xs text-slate-400 mt-2">Basato su {stats.pagesPerHour} pag/ora</p>
                                        </div>
                                    </div>
                                    <div className="space-y-4">
                                        <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700">
                                            <label className="block text-sm font-bold uppercase text-purple-400 mb-2 flex items-center gap-2"><Icons.CheckCircle className="w-4 h-4"/> Totale Esercizi</label>
                                            <input type="number" value={totalExercisesGoal} onChange={(e) => setTotalExercisesGoal(Math.max(0, Number(e.target.value)))} className="w-full bg-slate-900 p-4 rounded-xl text-2xl text-white border border-slate-600 mb-4" />
                                            <div className="flex justify-between text-sm mb-1"><span className="text-slate-400">Progresso</span><span className="text-white font-bold">{prediction.progressEx}%</span></div>
                                            <div className="h-3 bg-slate-900 rounded-full overflow-hidden"><div className="h-full bg-purple-500 transition-all duration-1000" style={{ width: `${prediction.progressEx}%` }}></div></div>
                                        </div>
                                        <div className="bg-gradient-to-br from-purple-900/50 to-slate-900 p-6 rounded-2xl border border-purple-500/30 text-center">
                                            <p className="text-purple-200 mb-1 text-sm uppercase tracking-wider">Tempo stimato esercizi</p>
                                            <h3 className="text-4xl font-black text-white">{prediction.hoursEx} <span className="text-xl text-slate-400 font-normal">ore</span></h3>
                                            <p className="text-xs text-slate-400 mt-2">Basato su {stats.exercisesPerHour} es/ora</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {isAddModalOpen && (
                        <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
                            <div className="bg-slate-900 p-6 rounded-xl w-full max-w-sm border border-slate-800 shadow-2xl">
                                <div className="flex items-center gap-2 mb-4">
                                    {isGoalEntry ? <Icons.Flag className="w-6 h-6 text-cyan-400" /> : <Icons.Calendar className="w-6 h-6 text-white" />}
                                    <h3 className={`text-xl font-bold ${isGoalEntry ? 'text-cyan-400' : 'text-white'}`}>
                                        {isGoalEntry ? "Imposta Obiettivo" : "Aggiungi Data"}
                                    </h3>
                                </div>
                                <input type="date" className="w-full bg-slate-950 p-3 rounded-lg text-white mb-6 border border-slate-700 focus:border-indigo-500 outline-none" value={newEntryDate} onChange={(e) => setNewEntryDate(e.target.value)} />
                                <div className="flex gap-3">
                                    <button onClick={() => setIsAddModalOpen(false)} className="flex-1 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 transition-colors">Annulla</button>
                                    <button onClick={() => newEntryDate && addEntry(newEntryDate, isGoalEntry)} className={`flex-1 py-2 rounded-lg text-white font-medium transition-colors ${isGoalEntry ? 'bg-cyan-600 hover:bg-cyan-500' : 'bg-indigo-600 hover:bg-indigo-500'}`}>
                                        {isGoalEntry ? "Salva Obiettivo" : "Aggiungi"}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
